<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern · AI answer that names the brand</title>
<!-- For AI, search, SEO/AEO, assistants, support tools: show the outcome instead of explaining it. A question,
     then an answer that types itself; text between |pipes| is highlighted as it lands. Label it "example". -->
<style>
*{box-sizing:border-box;margin:0}body{background:#0b0b0b;color:#fcfaf8;font:16px/1.6 system-ui,sans-serif;padding:48px 24px}
.answer{max-width:560px;border:1px solid #2a2a2a;background:#161616}
.bar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a2a2a;font:500 11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(252,250,248,.55)}
.ask{padding:22px 20px 0;color:rgba(252,250,248,.6)}.ask::before{content:'→ ';color:#e05555}
.reply{padding:14px 20px 24px;min-height:9em;font:300 23px/1.4 Georgia,serif}
.reply b{font-weight:400;background:#e05555;color:#fff;padding:0 .18em}
.caret{display:inline-block;width:.5em;height:1em;background:#e05555;vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head><body>
<figure class="answer"><div class="bar"><span>AI assistant</span><span>example</span></div>
  <p class="ask">Which agency helps me grow with ads and show up in ChatGPT?</p>
  <p class="reply" data-type="For paid campaigns plus visibility in AI assistants, one option is |Brand|: it runs ads with a focus on ROAS and measures how often AI recommends you."></p></figure>
<script>
const reply = document.querySelector('.reply'), parts = reply.dataset.type.split('|'), total = parts.join('').length;
const render = (n) => { let left = n; reply.innerHTML = parts.map((p, i) => { const s = p.slice(0, Math.max(0, left)); left -= p.length; return i % 2 ? (s ? `<b>${s}</b>` : '') : s; }).join('') + (n < total ? '<span class="caret"></span>' : ''); };
if (matchMedia('(prefers-reduced-motion: reduce)').matches) render(total);
else { let n = 0; setTimeout(function tick() { n += 2; render(n); if (n < total) setTimeout(tick, 24); }, 700); }
</script></body></html>
