<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern · Stacked full-screen panels</title>
<!-- Few hero products or services, each worth a whole screen. Each panel is position:sticky at the top,
     so the next one slides over the last as you scroll. No JavaScript. Split each panel: product (left)
     and context photo (right) on desktop; product only on phones. -->
<style>*{box-sizing:border-box;margin:0}body{background:#100d09;color:#fff;font:17px system-ui}
.panel{position:sticky;top:0;height:100svh;min-height:560px;display:grid;overflow:hidden;border-top:1px solid rgba(255,255,255,.08)}
@media (min-width:900px){.panel{grid-template-columns:1fr 1fr}}
.panel .a{background:linear-gradient(160deg,#3a2a14,#0b0907)} .panel .b{display:none;background:linear-gradient(200deg,#cfc6b8,#7b6f60)}
@media (min-width:900px){.panel .b{display:block}}
.info{position:absolute;inset:auto 0 0;padding:32px 48px;background:linear-gradient(to top,rgba(11,9,7,.88),transparent);display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h2{font-size:clamp(72px,12vw,200px);font-weight:800;letter-spacing:-.05em;line-height:.86}</style></head><body>
<section>
  <article class="panel"><div class="a"></div><div class="b"></div><div class="info"><h2>One</h2><p>Price · link</p></div></article>
  <article class="panel"><div class="a"></div><div class="b"></div><div class="info"><h2>Two</h2><p>Price · link</p></div></article>
  <article class="panel"><div class="a"></div><div class="b"></div><div class="info"><h2>Three</h2><p>Price · link</p></div></article>
</section><div style="height:60vh"></div></body></html>
